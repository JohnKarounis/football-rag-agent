[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "football-rag-agent"
version = "0.1.0"
description = "Football Q&A with RAG, a tool-calling agent and Corrective RAG, evaluated at every stage."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langchain-core==1.7.0",
    "langchain-openai==1.7.2",
    "langchain-chroma==1.1.0",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.14",
    "chromadb==1.5.9",
    "openai==3.31.0",
    "pydantic==2.13.5",
    "numpy==2.4.6",
    "requests==2.34.2",
    "fastapi==0.142.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
experiments = ["rank-bm25==0.2.2", "sentence-transformers==6.2.0"]
dev = ["pytest", "ruff", "ipykernel==7.3.0"]

[tool.setuptools.packages.find]
where = ["src"]